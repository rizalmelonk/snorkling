<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FE0D6"/>
      <stop offset="1" stop-color="#0FA3B1"/>
    </linearGradient>
    <clipPath id="lensL"><ellipse cx="70" cy="95" rx="34" ry="30"/></clipPath>
    <clipPath id="lensR"><ellipse cx="130" cy="95" rx="34" ry="30"/></clipPath>
  </defs>

  <g transform="translate(25,25)">
    <!-- strap -->
    <path d="M22 88 Q4 92 0 108" stroke="#FFFFFF" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M178 88 Q196 92 200 108" stroke="#FFFFFF" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- snorkel tube -->
    <path d="M168 62 L176 22 Q178 10 192 12" stroke="#FF8A3D" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="194" cy="12" r="6" fill="#FF8A3D"/>
    <!-- mask frame -->
    <rect x="22" y="58" width="156" height="84" rx="34" fill="#FFFFFF"/>
    <path d="M90 138 Q100 164 110 138 Z" fill="#FFFFFF"/>
    <rect x="94" y="80" width="12" height="30" rx="6" fill="#FFFFFF"/>
    <!-- lenses -->
    <ellipse cx="70" cy="95" rx="34" ry="30" fill="url(#sea)"/>
    <ellipse cx="130" cy="95" rx="34" ry="30" fill="url(#sea)"/>
    <!-- waves inside lenses -->
    <g clip-path="url(#lensL)" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <path d="M32 98 q9 -9 18 0 t18 0 t18 0 t18 0"/>
      <path d="M32 112 q9 -9 18 0 t18 0 t18 0 t18 0" opacity="0.6"/>
    </g>
    <g clip-path="url(#lensR)" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9">
      <path d="M92 98 q9 -9 18 0 t18 0 t18 0 t18 0"/>
      <path d="M92 112 q9 -9 18 0 t18 0 t18 0 t18 0" opacity="0.6"/>
    </g>
    <!-- shine -->
    <path d="M52 78 q6 -8 16 -9" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M112 78 q6 -8 16 -9" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- bubbles -->
    <circle cx="150" cy="40" r="5" fill="none" stroke="#0FA3B1" stroke-width="3"/>
    <circle cx="136" cy="24" r="3.5" fill="none" stroke="#0FA3B1" stroke-width="3"/>
    <circle cx="124" cy="10" r="2.5" fill="none" stroke="#0FA3B1" stroke-width="3"/>
  </g>

  <!-- text -->
  <text x="270" y="130" font-family="'Montserrat','Poppins','Segoe UI',Arial,sans-serif" font-size="78" font-weight="800" fill="#FFFFFF" letter-spacing="2">PIAN</text>
  <text x="270" y="190" font-family="'Montserrat','Poppins','Segoe UI',Arial,sans-serif" font-size="58" font-weight="700" fill="#0FA3B1" letter-spacing="14">GUIDE</text>
  <rect x="270" y="146" width="70" height="6" rx="3" fill="#FF8A3D"/>
</svg>
