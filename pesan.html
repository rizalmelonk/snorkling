<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Pesan Trip - PIAN GUIDE</title>

<link rel="stylesheet"
      href="style.css">

</head>

<body>

<header class="top">

<div class="wrap">

<a href="index.html"
   class="logo">
PIAN <span>GUIDE</span>
</a>

<nav>

<a href="index.html">
Trip Snorkeling
</a>

<a href="biaya.html">
Biaya
</a>

<a href="galeri.html">
Galeri
</a>

<a href="pesan.html"
   class="active">
Pesan
</a>

</nav>

</div>

</header>


<main>


<section class="page-title">

<div class="wrap">

<h1>
Pesan Trip
</h1>

<p>
Isi data perjalanan Anda,
kemudian kirim melalui WhatsApp.
</p>

</div>

</section>


<section>

<div class="wrap">

<div class="contact">

<h2>
Form Pemesanan
</h2>

<p>
Lengkapi data berikut agar kami
dapat mengonfirmasi perjalanan Anda.
</p>


<form
onsubmit="return false"
>


<div>

<label for="nama">
Nama Lengkap
</label>

<input
id="nama"
type="text"
placeholder="Masukkan nama lengkap"
autocomplete="name"
>

</div>


<div>

<label for="paket">
Paket Trip
</label>

<select id="paket">

<option value="Price list">
Price List
</option>

<option value="3 Gili Sekotong">
3 Gili Sekotong
</option>

<option value="Secret Gilis Lombok">
Secret Gilis Lombok
</option>

</select>

</div>


<div class="row">


<div>

<label for="tanggal">
Tanggal Trip
</label>

<input
id="tanggal"
type="date"
>

</div>


<div>

<label for="jumlahOrang">
Jumlah Orang
</label>

<input
id="jumlahOrang"
type="number"
min="1"
max="100"
value="2"
>

</div>


</div>


<div>

<label for="catatan">
Catatan / Permintaan Khusus
</label>

<textarea
id="catatan"
placeholder="Contoh: titik jemput, permintaan khusus, dll."
></textarea>

</div>


<div class="est">

Perkiraan Total

<b id="estimasi">
-
</b>

<span id="keterangan">
</span>

</div>


<p
class="err"
id="error">
</p>


<a
id="kirim"
href="#"
target="_blank"
class="btn"
>
Kirim ke WhatsApp
</a>


</form>

</div>

</div>

</section>

</main>


<footer>

<div class="wrap">

PIAN GUIDE · Buka setiap hari
06.00–18.00

</div>

</footer>


<script>
(function () {
  var HARGA_PER_ORANG = 350000;
  var NOMOR_WA = '62XXXXXXXXXXX'; // ganti dengan nomor WhatsApp Anda (format 62, tanpa + dan tanpa 0 di depan)

  var nama = document.getElementById('nama');
  var paket = document.getElementById('paket');
  var tanggal = document.getElementById('tanggal');
  var jumlahOrang = document.getElementById('jumlahOrang');
  var catatan = document.getElementById('catatan');
  var estimasi = document.getElementById('estimasi');
  var keterangan = document.getElementById('keterangan');
  var error = document.getElementById('error');
  var kirim = document.getElementById('kirim');

  function rupiah(n) {
    return 'Rp ' + n.toLocaleString('id-ID');
  }

  function ambilJumlah() {
    var j = parseInt(jumlahOrang.value, 10);
    if (isNaN(j) || j < 1) j = 1;
    if (j > 100) j = 100;
    return j;
  }

  function formatTanggal(v) {
    if (!v) return '-';
    var p = v.split('-');
    var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
    return d.toLocaleDateString('id-ID', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });
  }

  function buatLink() {
    var jumlah = ambilJumlah();
    var total = HARGA_PER_ORANG * jumlah;
    var pesan =
      'Halo PIAN GUIDE, saya ingin memesan trip.\n\n' +
      'Nama: ' + nama.value.trim() + '\n' +
      'Paket: ' + paket.value + '\n' +
      'Tanggal: ' + formatTanggal(tanggal.value) + '\n' +
      'Jumlah orang: ' + jumlah + '\n' +
      'Perkiraan total: ' + rupiah(total) + ' (' + rupiah(HARGA_PER_ORANG) + '/orang)\n' +
      'Catatan: ' + (catatan.value.trim() || '-');
    return 'https://wa.me/' + NOMOR_WA + '?text=' + encodeURIComponent(pesan);
  }

  function hitung() {
    var jumlah = ambilJumlah();
    var total = HARGA_PER_ORANG * jumlah;
    estimasi.textContent = rupiah(total);
    keterangan.textContent = ' (' + rupiah(HARGA_PER_ORANG) + ' × ' + jumlah + ' orang)';
    kirim.href = buatLink();
  }

  jumlahOrang.addEventListener('input', hitung);
  jumlahOrang.addEventListener('change', function () {
    jumlahOrang.value = ambilJumlah();
    hitung();
  });
  [nama, paket, tanggal, catatan].forEach(function (el) {
    el.addEventListener('input', hitung);
    el.addEventListener('change', hitung);
  });

  kirim.addEventListener('click', function (e) {
    error.textContent = '';
    if (!nama.value.trim()) {
      e.preventDefault();
      error.textContent = 'Nama lengkap wajib diisi.';
      nama.focus();
      return;
    }
    if (!tanggal.value) {
      e.preventDefault();
      error.textContent = 'Tanggal trip wajib dipilih.';
      tanggal.focus();
      return;
    }
    kirim.href = buatLink();
  });

  hitung();
})();
</script>

</body>

</html>
